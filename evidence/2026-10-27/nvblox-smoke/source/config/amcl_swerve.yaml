amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: /arm_depth/scan
    map_topic: /map
    set_initial_pose: true
    initial_pose.x: 0.35
    initial_pose.y: 2.85
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    initial_cov_xx: 0.0001
    initial_cov_yy: 0.0001
    initial_cov_aa: 0.0003046174
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    min_particles: 500
    max_particles: 1500
    max_beams: 180
    laser_model_type: likelihood_field
    laser_min_range: 0.23
    laser_max_range: 5.0
    laser_likelihood_max_dist: 0.5
    sigma_hit: 0.02
    z_hit: 0.95
    z_rand: 0.05
    update_min_d: 0.01
    update_min_a: 0.01
    resample_interval: 1
    transform_tolerance: 0.2
    tf_broadcast: true
    random_seed: 7
    save_pose_rate: -1.0
